<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair this device — clideck</title>
  <link rel="stylesheet" href="/tailwind.css">
  <style>
    /* Minimal placeholder styling. 16-06 ships the real visual treatment;
       this just makes the placeholder legible if Lance navigates to /pair
       between 16-04 and 16-06 landing. */
    body { background: #0f1115; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 28rem; margin: 4rem auto; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; }
    input { display: block; width: 100%; padding: 0.75rem; margin-bottom: 0.75rem;
            background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
            border-radius: 0.375rem; font-size: 1rem; }
    input#otp { font-family: ui-monospace, "SF Mono", monospace; text-transform: uppercase;
                letter-spacing: 0.1em; text-align: center; }
    button { width: 100%; padding: 0.75rem; background: #6366f1; color: white;
             border: 0; border-radius: 0.375rem; font-size: 1rem; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #pair-error { color: #f87171; margin-top: 1rem; padding: 0.75rem;
                  background: rgba(239, 68, 68, 0.1); border-radius: 0.375rem; }
  </style>
</head>
<body>
  <main>
    <h1>Pair this device</h1>
    <p>Enter the 6-character code from your server's boot log or from an already-paired device's Settings → Linked devices.</p>
    <input id="otp" maxlength="7" autocomplete="off" autocapitalize="characters" placeholder="ABC-DEF" autofocus>
    <input id="label" maxlength="32" placeholder="Lance iPhone">
    <button id="pair-submit">Pair this device</button>
    <div id="pair-error" hidden></div>
  </main>
  <!-- PHASE 16-04 PLACEHOLDER — full UI in 16-06. Pair logic (form-submit → POST /pair/redeem → store token in localStorage → redirect to /) ships with public/js/pair.js in plan 16-06. The 404 on /js/pair.js below is expected until then. -->
  <script type="module" src="/js/pair.js"></script>
</body>
</html>
